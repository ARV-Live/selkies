version: "3.9"
services:
  dist:
    image: selkies-py-build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYPI_PACKAGE: selkies
        PACKAGE_VERSION: 0.0.0.dev0
  web:
    image: selkies-web-core
    build:
      # The Dockerfile copies sibling addons folders (selkies-web-core,
      # selkies-dashboard, universal-touch-gamepad), so the context must be
      # the parent `addons/` directory, not the selkies-web-core subdirectory.
      context: ./addons
      dockerfile: selkies-web-core/Dockerfile
  js-interposer:
    # Produces /opt/*.deb that the test container installs for gamepad support.
    image: selkies-js-interposer:main-ubuntu${DISTRIB_RELEASE:-24.04}
    build:
      context: ./addons/js-interposer
      dockerfile: Dockerfile.debpkg
      target: build
      args:
        DISTRIB_IMAGE: ${DISTRIB_IMAGE:-ubuntu}
        DISTRIB_RELEASE: ${DISTRIB_RELEASE:-24.04}
        PKG_NAME: selkies-js-interposer
        PKG_VERSION: 0.0.0
  fake-udev:
    # Produces /opt/libudev_0.0.0.deb required by the js-interposer .deb.
    image: selkies-fake-udev:main-ubuntu${DISTRIB_RELEASE:-24.04}
    build:
      context: ./addons/fake-udev
      dockerfile: Dockerfile.debpkg
      args:
        DISTRIB_IMAGE: ${DISTRIB_IMAGE:-ubuntu}
        DISTRIB_RELEASE: ${DISTRIB_RELEASE:-24.04}
        PKG_NAME: libudev
        PKG_VERSION: 0.0.0
  test:
    ###
    # NOTE: export the DISTRIB_IMAGE and DISTRIB_RELEASE environment variables to change the base image during build and run.
    ###

    image: selkies-example:latest-${DISTRIB_IMAGE:-ubuntu}${DISTRIB_RELEASE:-24.04}
    # The image's own ENTRYPOINT is supervisord which boots X + selkies. The
    # upstream compose override (`["/tini", "--", "/bin/bash"]`) drops you into
    # an interactive shell for debugging, but tini isn't installed and we want
    # the streaming stack to actually start for local testing. Use
    # `docker compose exec test bash` if you need a shell while it's running.
    build:
      context: ./addons/example
      dockerfile: Dockerfile
      args:
        DISTRIB_IMAGE: ${DISTRIB_IMAGE:-ubuntu}
        DISTRIB_RELEASE: ${DISTRIB_RELEASE:-24.04}

        PY_BUILD_IMAGE: selkies-py-build:latest
        WEB_IMAGE: selkies-web-core:latest
        # Point at the locally-built js-interposer and fake-udev images
        # produced by the js-interposer / fake-udev compose services.
        JS_BASE_IMAGE: selkies-js-interposer
        JS_BASE_IMAGE_RELEASE: main
        LIBUDEV_IMAGE: selkies-fake-udev
        LIBUDEV_IMAGE_RELEASE: main
        PYPI_PACKAGE: selkies
        PACKAGE_VERSION: 0.0.0.dev0
    environment:
      # Basic authentication
      SELKIES_ENABLE_BASIC_AUTH: ${SELKIES_ENABLE_BASIC_AUTH}
      SELKIES_BASIC_AUTH_USER: ${SELKIES_BASIC_AUTH_USER}
      SELKIES_BASIC_AUTH_PASSWORD: ${SELKIES_BASIC_AUTH_PASSWORD}

      # TURN with shared secret or user/pass
      SELKIES_TURN_SHARED_SECRET: ${SELKIES_TURN_SHARED_SECRET}
      SELKIES_TURN_HOST: ${SELKIES_TURN_HOST}
      SELKIES_TURN_PORT: ${SELKIES_TURN_PORT}
      SELKIES_TURN_USERNAME: ${SELKIES_TURN_USERNAME}
      SELKIES_TURN_PASSWORD: ${SELKIES_TURN_PASSWORD}

      # Turn with coTURN web
      SELKIES_TURN_REST_URI: ${SELKIES_TURN_REST_URI}
      SELKIES_TURN_REST_USERNAME: ${SELKIES_TURN_REST_USERNAME}
      SELKIES_TURN_REST_AUTHHEADER: ${SELKIES_TURN_REST_AUTHHEADER}

      # Additional server-side settings.
      SELKIES_ENABLE_RESIZE: ${SELKIES_ENABLE_RESIZE}

      # DEBUG remote cursors
      SELKIES_DEBUG_CURSORS: ${SELKIES_DEBUG_CURSORS:-false}

      # Start full XFCE4 session, vs just X11 server.
      START_XFCE4: ${START_XFCE4:-true}
    ports:
      - "8090:8080"
    # NOTE: the upstream compose used to bind-mount ./src/selkies into the
    # container's installed package path for hot-reloading Python sources.
    # That mount shadows the wheel-bundled `selkies_web` directory (which
    # only exists inside the image after `docker build`), causing the
    # WebSocket server to die with `No module named 'selkies.selkies_web'`.
    # Re-enable below if you need to iterate on Python without rebuilding.
    #volumes:
    #  - type: bind
    #    source: ./src/selkies
    #    target: /usr/local/lib/python3.12/dist-packages/selkies
    #    read_only: true

    # Configure for interactive session
    stdin_open: true
    tty: true
