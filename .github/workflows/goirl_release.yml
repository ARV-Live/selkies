# goIRL — customized selkies release workflow.
#
# What it does on a `vX.Y.Z` tag push (or manual run):
#   1. Builds the locally-customized addon images:
#        - selkies-web-core      (web-core + branded dashboard, lottie loader, etc.)
#        - selkies-js-interposer (joystick passthrough .deb)
#        - selkies-fake-udev     (fake libudev .deb)
#        - selkies-py-build      (python wheel + bundled web frontend)
#        - selkies-example       (full Ubuntu test container — the portable runtime)
#   2. Pushes the example image to GHCR under
#        ghcr.io/<owner>/<repo>:<version> and :latest
#      — this is the "portable binary": pull + run on any Linux host with Docker.
#   3. Extracts the python wheel and the built web bundle from the images and
#      packs them into a release tarball for users that want to install on
#      bare metal without Docker.
#   4. Publishes a GitHub Release with the tarball attached and the docker
#      pull command in the release notes.
#
# Trigger: push a tag like `v1.2.3` or run manually from the Actions tab.

name: goIRL release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Linux distribution the example image is built on. Match the dev compose.
  DISTRIB_IMAGE: ubuntu
  DISTRIB_RELEASE: "24.04"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release + upload assets
      packages: write   # to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          # Use the tag if pushed, else the manual workflow_dispatch input.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a valid vX.Y.Z[-suffix] version"
            exit 1
          fi
          SEMVER="${TAG#v}"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (semver ${SEMVER})"

      - name: Set up Docker Buildx
        # Use the host docker daemon directly (driver: docker) instead of
        # the default docker-container driver. Reason: we chain five image
        # builds where each subsequent stage references the previous one
        # by tag (e.g. `FROM selkies-web-core:latest`). The default isolated
        # buildx builder can't see images that were `--load`ed into the host
        # daemon, so it tries to pull them from Docker Hub and fails with
        # `pull access denied`. The `docker` driver uses the host's image
        # store, so cross-stage references resolve locally. The trade-off
        # is no multi-platform builds — fine for our amd64-only release.
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for GHCR
        id: repo
        run: echo "image=${REGISTRY,,}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # ---- 1. Build the web bundle (frontend) ----
      - name: Build selkies-web-core
        run: |
          docker buildx build \
            --load \
            -t selkies-web-core:latest \
            -f addons/selkies-web-core/Dockerfile \
            addons

      # ---- 2. Build the python wheel (includes the bundled web frontend) ----
      - name: Build selkies-py-build (wheel + web)
        run: |
          docker buildx build \
            --load \
            -t selkies-py-build:latest \
            --build-arg PYPI_PACKAGE=selkies \
            --build-arg PACKAGE_VERSION=${{ steps.ver.outputs.semver }} \
            -f Dockerfile \
            .

      # ---- 3. Build the joystick + fake-udev .deb images ----
      - name: Build selkies-js-interposer
        run: |
          docker buildx build \
            --load \
            --target build \
            -t selkies-js-interposer:main-${DISTRIB_IMAGE}${DISTRIB_RELEASE} \
            --build-arg DISTRIB_IMAGE=${DISTRIB_IMAGE} \
            --build-arg DISTRIB_RELEASE=${DISTRIB_RELEASE} \
            --build-arg PKG_NAME=selkies-js-interposer \
            --build-arg PKG_VERSION=0.0.0 \
            -f addons/js-interposer/Dockerfile.debpkg \
            addons/js-interposer

      - name: Build selkies-fake-udev
        run: |
          docker buildx build \
            --load \
            -t selkies-fake-udev:main-${DISTRIB_IMAGE}${DISTRIB_RELEASE} \
            --build-arg DISTRIB_IMAGE=${DISTRIB_IMAGE} \
            --build-arg DISTRIB_RELEASE=${DISTRIB_RELEASE} \
            --build-arg PKG_NAME=libudev \
            --build-arg PKG_VERSION=0.0.0 \
            -f addons/fake-udev/Dockerfile.debpkg \
            addons/fake-udev

      # ---- 4. Build & push the runtime image to GHCR ----
      - name: Build & push selkies-example to GHCR
        run: |
          IMAGE="${{ steps.repo.outputs.image }}"
          TAG="${{ steps.ver.outputs.tag }}"
          docker buildx build \
            --push \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            --build-arg DISTRIB_IMAGE=${DISTRIB_IMAGE} \
            --build-arg DISTRIB_RELEASE=${DISTRIB_RELEASE} \
            --build-arg PY_BUILD_IMAGE=selkies-py-build:latest \
            --build-arg WEB_IMAGE=selkies-web-core:latest \
            --build-arg JS_BASE_IMAGE=selkies-js-interposer \
            --build-arg JS_BASE_IMAGE_RELEASE=main \
            --build-arg LIBUDEV_IMAGE=selkies-fake-udev \
            --build-arg LIBUDEV_IMAGE_RELEASE=main \
            --build-arg PYPI_PACKAGE=selkies \
            --build-arg PACKAGE_VERSION=${{ steps.ver.outputs.semver }} \
            -f addons/example/Dockerfile \
            addons/example

      # ---- 5. Build the portable bare-metal bundle ----
      #
      - name: Extract selkies wheel from selkies-py-build
        run: |
          set -euo pipefail
          mkdir -p bundle-stage/wheel
          CID="$(docker create selkies-py-build:latest)"
          docker cp "${CID}:/opt/pypi/dist/." bundle-stage/wheel/
          docker rm "${CID}" >/dev/null
          ls -la bundle-stage/wheel/

      - name: Build portable bundle (debian:12 venv with selkies + deps)
        id: bundle
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SEMVER="${{ steps.ver.outputs.semver }}"
          BUNDLE_DIR_NAME="selkies-gstreamer-portable-${TAG}_amd64"
          BUNDLE_NAME="${BUNDLE_DIR_NAME}.tar.gz"

          # Run the bundle build inside debian:12 so the venv's compiled wheels
          # link against the same glibc/library set the GPU VM has.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e BUNDLE_DIR_NAME="${BUNDLE_DIR_NAME}" \
            -e SEMVER="${SEMVER}" \
            debian:12 \
            bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              # Build deps: python venv + native build chain for any sdist
              # packages that lack manylinux wheels.
              apt-get install -y --no-install-recommends \
                python3 python3-venv python3-pip python3-dev \
                build-essential pkg-config \
                libffi-dev libssl-dev \
                libsrtp2-dev libopus-dev libvpx-dev libavcodec-dev \
                libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
                libxkbcommon-dev \
                ca-certificates curl

              STAGE="/tmp/${BUNDLE_DIR_NAME}"
              mkdir -p "${STAGE}"

              # 1. Build the venv inside the stage dir so paths are relative.
              python3 -m venv "${STAGE}/venv"
              # Pin pip + give ourselves a stable upgrade path. Use `--upgrade`
              # so the bundled wheel of pip is current.
              "${STAGE}/venv/bin/pip" install --no-cache-dir --upgrade pip setuptools wheel

              # 2. Install the selkies wheel produced earlier in this job.
              "${STAGE}/venv/bin/pip" install --no-cache-dir bundle-stage/wheel/*.whl

              # 3. Drop the launcher script ansible execs as
              #    /opt/selkies/selkies-gstreamer-run. Activate the venv
              #    relative to its own location so the directory can be
              #    moved/renamed without breaking the run.
              cat > "${STAGE}/selkies-gstreamer-run" <<'\''LAUNCH'\''
#!/bin/bash
# Portable launcher for the goIRL selkies build.
# Resolves its own directory, activates the bundled venv, and
# hands all CLI args off to `python -m selkies`.

set -eu

HERE="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
VENV="${HERE}/venv"

if [ ! -x "${VENV}/bin/python" ]; then
    echo "selkies-gstreamer-run: bundled venv not found at ${VENV}" >&2
    exit 1
fi

export VIRTUAL_ENV="${VENV}"
export PATH="${VENV}/bin:${PATH}"

exec "${VENV}/bin/python" -m selkies "$@"
LAUNCH
              chmod +x "${STAGE}/selkies-gstreamer-run"

              # 4. Plain-text version file for ops diagnostics.
              echo "${SEMVER}" > "${STAGE}/VERSION"

              # 5. Concise README.
              cat > "${STAGE}/README.md" <<README
# goIRL — portable selkies bundle

Version: ${SEMVER} (amd64, Debian 12 ABI)

## Layout
- \`selkies-gstreamer-run\`  — executable launcher (matches the upstream name)
- \`venv/\`                  — bundled Python virtualenv with selkies + deps
- \`VERSION\`                — version string

## Install (matches goirl_gcloud/ansible expectation)
\`\`\`
sudo install -d -o debian -g debian /opt/selkies
sudo tar -xzf selkies-gstreamer-portable-v\${VERSION}_amd64.tar.gz \\
    -C /opt/selkies --strip-components=1
sudo chown -R debian:debian /opt/selkies
\`\`\`

The ansible playbook in goirl_gcloud already wires the systemd unit and
runtime flags around this layout.

## Required system packages
This bundle ships the Python side only; the host must already provide the
X11/GStreamer/PipeWire stack the playbook installs (see
\`addons/example/Dockerfile\` for the exhaustive list).
README

              # 6. Pack. `tar -czf foo.tar.gz -C /tmp <dirname>` produces
              #    foo.tar.gz with a single top-level directory equal to
              #    <dirname>, which is what `--strip-components=1` consumes.
              tar -C /tmp -czf "/work/${BUNDLE_DIR_NAME}.tar.gz" "${BUNDLE_DIR_NAME}"

              # 7. Sanity check: the launcher boots and reports its CLI.
              "${STAGE}/selkies-gstreamer-run" --help >/dev/null \
                || { echo "selkies-gstreamer-run failed to start"; exit 1; }
            '

          # Surface the wheel separately for pip-only consumers
          cp bundle-stage/wheel/*.whl ./
          ls -la "${BUNDLE_NAME}" *.whl

          echo "bundle=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
          echo "wheel=$(ls *.whl | head -n1)" >> "$GITHUB_OUTPUT"

      # ---- 6. GitHub Release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## goIRL streaming — ${{ steps.ver.outputs.tag }}

            ### Portable Docker image

            ```
            docker pull ${{ steps.repo.outputs.image }}:${{ steps.ver.outputs.tag }}
            docker run --rm -p 8080:8080 ${{ steps.repo.outputs.image }}:${{ steps.ver.outputs.tag }}
            ```

            Open <http://localhost:8080>. Default login is `ubuntu` / `mypasswd`
            (set `SELKIES_ENABLE_BASIC_AUTH=false` to skip the prompt).

            ### Bare-metal (Debian 12 / Ansible)

            - **`selkies-gstreamer-portable-${{ steps.ver.outputs.tag }}_amd64.tar.gz`**
              — drop-in tarball, extracted into `/opt/selkies` by the
              `goirl_gcloud/ansible/playbook.yml`. Contains a bundled venv,
              the wheel, and a `selkies-gstreamer-run` launcher.
            - **`*.whl`** — raw Python wheel for `pip install`.

            See the README inside the tarball for the layout and install
            command.
          files: |
            ${{ steps.bundle.outputs.bundle }}
            ${{ steps.bundle.outputs.wheel }}
